<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email — BHN V3 mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  body { margin: 0; background: #050614; }
</style>
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script>
<script src="manifest.js"></script>
<script>
(function () {
  const S = BHNSim;
  const STATES = window.BHN_MANIFEST[2].states;
  const state = S.stateParam("sent");
  const root = document.getElementById("root");

  const mailIcon = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M3.5 5.5h17v13h-17z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m4 6.5 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* Both sentences are verbatim from origin/main. Neither says whether an
     account exists: `?sent=1` gets the conditional "If an account exists…"
     line for every input, and the API returns the same 303 for success,
     unknown email, empty email and upstream failure.

     This page is a confirmation only. There is no password field: the new
     password is entered on Auth0's hosted page from the emailed link. */
  const COPY = {
    sent: "If an account exists for that address, we have sent a link to reset your password.",
    direct: "Follow the link in your email to finish resetting your password.",
  };
  const copy = state === "direct" ? COPY.direct : COPY.sent;

  root.innerHTML = S.frame(`
    <section class="bhn-acct-narrow">
      <article class="bhn-acct-panel is-cta-bottom">
        <div class="bhn-acct-title-row">
          <span class="bhn-acct-icon is-emerald">${mailIcon}</span>
          <div style="min-width:0">
            <p class="bhn-acct-eyebrow is-emerald">Welcome back</p>
            <h1 class="bhn-acct-h2">Check your email</h1>
          </div>
        </div>
        <div class="bhn-acct-detail">
          <p class="bhn-acct-body" data-keep-last>${copy}</p>
        </div>
        <a href="#" onclick="return false" class="bhn-acct-cta is-returning" id="back-to-sign-in">
          <span>Back to sign in</span>${S.arrow()}
        </a>
      </article>
    </section>`, { login: true, logoLabel: "BioHubNet" });
  S.keepLastWordsTogether(root);

  if (state === "focus") {
    const el = document.getElementById("back-to-sign-in");
    el.classList.add("is-sim-focus"); S.focusField(el);
    el.addEventListener("blur", () => el.classList.remove("is-sim-focus"), { once: true });
  }

  S.banner({ page: "Reset-password confirmation · /reset-password", states: STATES, current: state });
})();
</script>
</body>
</html>
