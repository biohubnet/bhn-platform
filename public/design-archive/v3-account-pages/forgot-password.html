<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — BHN V3 mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  body { margin: 0; background: #050614; }
  .fp-field { margin-top: 1.25rem; }
  .fp-back { margin-top: 1rem; align-self: flex-start; }
  /* balance, not the inherited `pretty`: at 36rem the note otherwise leaves
     "Auth0 responds." stranded as a short second line. Scoped under
     .bhn-acct so it outranks shared.css `.bhn-acct p`, which would
     otherwise win on specificity. */
  .bhn-acct .fp-note { margin: 1rem 0 0; font-size: 0.75rem; line-height: 1.25rem; color: #94a3b8; text-wrap: balance; }
</style>
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script>
<script src="manifest.js"></script>
<script>
(function () {
  const S = BHNSim;
  const esc = S.esc;
  const STATES = window.BHN_MANIFEST[1].states;
  const state = S.stateParam("default");
  const root = document.getElementById("root");

  const keyIcon = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="15" r="4" stroke="currentColor" stroke-width="1.6"/><path d="m10.9 12.1 8.6-8.6M16.5 7l2.5 2.5M14 9.5l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* Copy, label, form action and link are exactly what origin/main renders
     and what tests/e2e/auth-reset.spec.ts pins:
       h1 "Reset your password" · label "Email" · button "Continue"
       form action="/api/reset-password" method="post" · link "Back to sign in" → /login
     Exactly one <form> and one label containing "email" on the page — the
     spec's locators are unscoped and would fail strict mode otherwise. */
  function page(o) {
    o = o || {};
    const button = o.submitting
      ? `<button type="submit" class="bhn-acct-cta is-returning" disabled aria-busy="true"><span>Sending link</span><span class="bhn-acct-spinner" aria-hidden="true"></span></button>`
      : `<button type="submit" class="bhn-acct-cta is-returning"><span>Continue</span>${S.arrow()}</button>`;
    const note = o.submitting
      ? `<p class="fp-note"><span class="sim-tag is-proposed">Proposed</span> Pending state. The live page has no pending copy and the button stays live while Auth0 responds.</p>`
      : "";
    return S.frame(`
      <section class="bhn-acct-narrow">
        <article class="bhn-acct-panel is-cta-bottom">
          <div class="bhn-acct-title-row">
            <span class="bhn-acct-icon is-emerald">${keyIcon}</span>
            <div style="min-width:0">
              <p class="bhn-acct-eyebrow is-emerald">Welcome back</p>
              <h1 class="bhn-acct-h2">Reset your password</h1>
            </div>
          </div>
          <form action="#" method="post" data-live-action="/api/reset-password" style="display:contents">
            <div class="bhn-acct-detail">
              <p class="bhn-acct-body" data-keep-last>Enter your email and we will send you a link to reset your password.</p>
              <div class="fp-field">
                <label class="bhn-acct-label" for="email">Email</label>
                <input class="bhn-acct-field" id="email" name="email" type="email" required autocomplete="email" value="${esc(o.value)}">
              </div>
              <a class="bhn-acct-link fp-back" href="#" onclick="return false">Back to sign in</a>
            </div>
            ${button}
          </form>
        </article>
        ${note}
      </section>`, { login: true, logoLabel: "BioHubNet" });
  }

  function render(o) { root.innerHTML = page(o); S.keepLastWordsTogether(root); }

  function validate() {
    const el = root.querySelector("#email");
    S.clearBubbles(root);
    const v = el.value || "";
    const msg = !v.trim() ? "Please fill out this field." : S.emailMessage(v);
    if (msg) { S.bubble(el, msg); el.focus(); return false; }
    return true;
  }

  root.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!validate()) return;
    const value = root.querySelector("#email").value;
    render({ value, submitting: true });
    // Simulated only: the live API always answers 303 to /reset-password?sent=1,
    // whatever happens upstream, so the mockup goes there too.
    setTimeout(() => { location.href = "reset-password.html?state=sent"; }, 1100);
  });

  const init = {
    "default": {},
    "focus": {},
    "validation-empty": { value: "" },
    "validation-format": { value: "priya.sample" },
    "submitting": { value: "priya.sample@example.ca", submitting: true },
  }[state] || {};
  render(init);
  if (state === "validation-empty" || state === "validation-format") validate();
  if (state === "focus") {
    const el = root.querySelector("#email");
    el.classList.add("is-sim-focus"); el.focus();
    el.addEventListener("blur", () => el.classList.remove("is-sim-focus"), { once: true });
  }

  S.banner({ page: "Forgot password · /forgot-password", states: STATES, current: state });
})();
</script>
</body>
</html>
