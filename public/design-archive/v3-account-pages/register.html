<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account — BHN V3 mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  body { margin: 0; background: #050614; }

  /* Registration layout. One column on mobile and tablet, reading order
     intro → form → programme context. From 64rem the intro and context
     share a left rail and the form takes the rest, so the long form gets
     the width without the page reordering for screen readers. */
  .reg-layout { display: grid; gap: 2rem; grid-template-areas: "intro" "form" "extra"; }
  .reg-intro, .reg-form, .reg-extra { min-width: 0; max-width: 48rem; }
  .reg-intro { grid-area: intro; }
  .reg-form { grid-area: form; }
  .reg-extra { grid-area: extra; }
  @media (min-width: 64rem) {
    .reg-layout {
      grid-template-columns: minmax(0, 19rem) minmax(0, 1fr);
      grid-template-areas: "intro form" "extra form";
      grid-template-rows: auto 1fr;
      column-gap: 3.5rem; row-gap: 2rem; align-items: start;
    }
    .reg-intro, .reg-form, .reg-extra { max-width: none; }
    /* Intro top edge sits level with the panel's first row of content. */
    .reg-intro { padding-top: 2rem; }
  }

  .reg-intro .bhn-acct-h1 { margin-top: 0.75rem; }
  .reg-intro .bhn-acct-body { margin-top: 0.75rem; }
  .reg-signin { margin-top: 1.1rem !important; }

  .reg-extra { display: grid; gap: 1rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.10); }
  .reg-extra .bhn-acct-h3 { margin-top: 0.5rem; }
  .reg-extra .bhn-acct-body { margin-top: 0.25rem; }
  .reg-extra .rule { padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.10); }

  .reg-form-inner { display: grid; gap: 1.75rem; min-width: 0; }
  .reg-section > h2 { margin: 0; }
  .reg-section h2:focus { outline: none; }
  .reg-fields { margin-top: 1.5rem; }
  .reg-foot { display: grid; gap: 0.75rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.10); }
  .reg-actions { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.75rem; }
  @media (min-width: 40rem) { .reg-actions { grid-template-columns: 11rem minmax(0, 1fr); } }
  /* Mirrors the live form: Back keeps its slot on step 1 so Next never
     changes width between steps. */
  .reg-back.is-invisible { visibility: hidden; }

  /* Four steps, one per block of the Talent Registration Form. Below 40rem
     the numeral sits above the name so no step name is cut off. */
  .reg-form .bhn-acct-steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 39.99rem) {
    .reg-form .bhn-acct-steps .meta { flex-direction: column; gap: 0.1rem; }
  }

  /* ── Questions ───────────────────────────────────────────────────────
     Each choice question is a native fieldset + legend, so every option
     is announced with its question. */
  .reg-stack { display: grid; gap: 2.25rem; }
  .reg-q { min-width: 0; margin: 0; padding: 0; border: 0; }
  .reg-q > legend { padding: 0; margin-bottom: 0.875rem; }
  .reg-pw-rules { margin: 0 0 0.25rem; padding-left: 1.1rem; font-size: 0.8125rem; line-height: 1.4rem; color: var(--ink-300); }
  .reg-choices { display: grid; gap: 0.625rem; }
  /* Long option lists read down each column, as on the source form. */
  .reg-cols { column-gap: 1.5rem; }
  @media (min-width: 40rem) { .reg-cols { column-count: 2; } }
  @media (min-width: 64rem) { .reg-cols { column-count: 3; } }
  .reg-cols > .bhn-acct-choice { break-inside: avoid; margin-bottom: 0.625rem; }
  /* Member institutions, one block per province; one radio group across all. */
  .reg-provinces { display: grid; gap: 1.25rem; }
  .reg-province { min-width: 0; margin: 0; padding: 0; border: 0; }
  .reg-province > legend { padding: 0; margin-bottom: 0.625rem; }
  .bhn-acct .reg-provinces + .reg-footnote { margin: 0.75rem 0 0; }
  .bhn-acct .reg-footnote { margin: 0.25rem 0 0; }
  .reg-rule { height: 0; margin: 1rem 0; border-top: 1px solid rgba(255, 255, 255, 0.10); }
  /* An option that carries its own free-text box. */
  .reg-other { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
  .reg-cols + .reg-other { margin-top: 0.125rem; }
  .reg-other .bhn-acct-choice { flex: 0 0 auto; align-items: center; }
  .reg-other .bhn-acct-choice input { margin-top: 0; }
  .reg-other .bhn-acct-field { flex: 1 1 auto; min-width: 0; min-height: 2.25rem; padding-block: 0.35rem; }
  /* On a phone the option label leaves too little room, so the box drops
     under it and takes the full width. */
  @media (max-width: 39.99rem) {
    .reg-other { flex-wrap: wrap; row-gap: 0.25rem; }
    .reg-other .bhn-acct-field { flex-basis: 100%; }
  }
  /* A simulated bubble clears the focus ring of the option below it. */
  .reg-q > .sim-bubble, .reg-other + .sim-bubble { margin-bottom: 0.5rem; }
  .bhn-acct-choice > span { text-wrap: pretty; }

  /* Rating grids: a table with one radio per cell. Below 40rem each row
     becomes its own short list, with the column name beside each radio. */
  .reg-grid { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 0.875rem; line-height: 1.35rem; }
  .reg-grid thead td { width: 40%; }
  .reg-grid th, .reg-grid td { padding: 0.7rem 0.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.10); text-align: center; vertical-align: middle; }
  .reg-grid thead th { font-size: 0.75rem; line-height: 1.1rem; font-weight: 700; color: var(--ink-300); vertical-align: bottom; }
  .reg-grid tbody th { width: 40%; padding-left: 0; text-align: left; font-weight: 500; color: var(--ink-200); }
  .reg-grid .bhn-acct-choice { justify-content: center; }
  .reg-grid .bhn-acct-choice input { margin: 0; }
  .reg-grid .cap { display: none; }
  @media (max-width: 39.99rem) {
    .reg-grid thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .reg-grid, .reg-grid tbody, .reg-grid tr, .reg-grid th, .reg-grid td { display: block; }
    .reg-grid tr { padding: 0.8rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.10); }
    .reg-grid th, .reg-grid td { width: auto; padding: 0; border: 0; text-align: left; }
    .reg-grid tbody th { width: auto; margin-bottom: 0.5rem; font-weight: 600; }
    .reg-grid td + td { margin-top: 0.45rem; }
    .reg-grid .bhn-acct-choice { justify-content: flex-start; }
    .reg-grid .cap { display: inline; }
  }

  .reg-block { display: grid; gap: 0.875rem; padding-top: 1.75rem; border-top: 1px solid rgba(255, 255, 255, 0.10); }
  .reg-textarea { min-height: 6.5rem; resize: vertical; }
  .reg-consent .bhn-acct-choice > span { color: var(--ink-300); }
  .reg-consent .req { color: var(--cyan-200); font-weight: 700; }

  /* ── Reproduction of the EXISTING approved pre-login page (PR #76 / #77)
     for the "Application submitted" end of the journey. Values copied
     from pre-login-page.css / .tsx. Not a redesign. */
  .pl-hero { max-width: 56rem; margin-inline: auto; text-align: center; }
  .pl-eyebrow { display: inline-flex; align-items: center; gap: 0.5rem; margin: 0; padding-block: 0.375rem; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.24em; color: #fef3c7; }
  .pl-diamond { width: 6px; height: 6px; transform: rotate(45deg); background: #fde68a; }
  .pl-h1 { margin: 1.25rem auto 0; max-width: 48rem; font-size: 1.875rem; line-height: 1.25; font-weight: 900; letter-spacing: -0.03em; color: #fff; }
  @media (min-width: 40rem) { .pl-h1 { font-size: 2.25rem; } }
  .pl-lead { margin: 1rem auto 0; max-width: 42rem; font-size: 0.875rem; line-height: 1.75rem; color: #cbd5e1; }
  @media (min-width: 40rem) { .pl-lead { font-size: 1rem; } }
  .pl-access { margin-top: 2.5rem; }
  .pl-notice { margin-bottom: 1.5rem; }
  .pl-options { display: grid; gap: 1.5rem; }
  .pl-account { position: relative; overflow: hidden; background: rgba(17, 31, 53, 0.66); display: grid; min-width: 0; grid-template-rows: auto 1fr auto; gap: 1.5rem; padding: 1.25rem; }
  @media (min-width: 40rem) { .pl-account { padding: 2rem; } }
  @media (min-width: 64rem) {
    .pl-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pl-account { grid-row: span 3; grid-template-rows: subgrid; }
  }
  .pl-detail { display: flex; min-width: 0; flex-direction: column; padding-inline-start: 3.75rem; }
  .pl-h3 { margin: 0.5rem 0 0; font-size: 1rem; line-height: 1.5rem; font-weight: 700; color: #fff; }
  .pl-p { margin: 0.375rem 0 0; font-size: 0.875rem; line-height: 1.5rem; color: #cbd5e1; }
  .pl-rule { margin-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.10); padding-top: 1rem; }
  .pl-hosted a { color: inherit; text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script>
<script src="manifest.js"></script>
<script>
(function () {
  const S = BHNSim;
  const esc = S.esc;
  const STATES = window.BHN_MANIFEST[0].states;
  const qs = new URLSearchParams(location.search);
  const state = S.stateParam("step1");
  const root = document.getElementById("root");

  /* ── Questions: exactly the Talent Registration Form (source PDF supplied
     in design review, 2026-09-14). Wording, option order, markers and
     required flags are copied as printed. Do not edit these to fit the
     layout. Approved in design review (2026-09-14); the live V3 form asks
     different questions. */
  const OTHER = "__other__";
  const STEP_NAMES = ["About You", "Education", "Survey", "Finish"];
  const LAST = STEP_NAMES.length - 1;
  /* Member institutions grouped by province (design review, 2026-09-14):
     provinces alphabetically, institutions in the form's own order within
     each. true = carries the form's "*" eligibility marker, joined to the
     name with a no-break space so it never wraps onto a line alone. */
  const INSTITUTIONS_BY_PROVINCE = [
    ["Alberta", [["Concordia University of Edmonton", true], ["University of Alberta", true], ["University of Calgary", true], ["University of Lethbridge", true]]],
    ["British Columbia", [["British Columbia Institute of Technology", true], ["Simon Fraser University", true], ["University of British Columbia", true], ["University of Victoria", true]]],
    ["Manitoba", [["University of Manitoba", true]]],
    ["Newfoundland and Labrador", [["Memorial University", true]]],
    ["Nova Scotia", [["Dalhousie University", true]]],
    ["Ontario", [
      ["Baycrest Hospital", true], ["Children's Hospital of Eastern Ontario", true], ["Hospital for Sick Children", false],
      ["McMaster University", true], ["Michael Garron Hospital", true], ["Queen's University", false],
      ["Seneca Polytechnic", false], ["Sinai Health", false], ["Sunnybrook Research Institute", false],
      ["The Ottawa Hospital", true], ["Toronto Metropolitan University", false], ["Unity Health Toronto", false],
      ["University Health Network", false], ["University of Guelph", false], ["University of Ottawa", true],
      ["University of Toronto", false], ["University of Waterloo", true], ["University of Windsor", false],
      ["Western University", false], ["York University", false],
    ]],
    ["Quebec", [
      ["Centre hospitalier Universitaire Sainte-Justine", true], ["École Polytechnique de Montréal", true],
      ["Institut national de la recherche scientifique", true], ["McGill University", true],
      ["Université de Montréal", true], ["Université de Sherbrooke", true], ["Université Laval", true],
    ]],
    ["Saskatchewan", [["University of Regina", true], ["University of Saskatchewan", true], ["Vaccine and Infectious Disease Organization (VIDO)", true]]],
  ];
  const POSITIONS = ["Graduate Program", "Postdoctoral Fellow", "Research Associate (equivalent to a PostDoc or higher)", "Research Assistant", "Laboratory Technician", "Other"];
  const SPECIALIZATIONS = ["Biochemistry", "Chemistry", "Molecular Biology", "Microbiology", "Computational Biology", "Cell Biology", "Immunology", "Health Science", "Biostatistics", "Pharmaceutical Science", "Biotechnology", "Biomedical Engineering", "Chemical Engineering"];
  const KNOWLEDGE_ROWS = ["Canadian Life Sciences industry", "Roles within industry"];
  const KNOWLEDGE_COLS = ["Clueless!", "Some understanding", "Good understanding"];
  const INTEREST_ROWS = ["R&D", "Biomanufacturing", "Quality Control/Quality Assurance", "Regulatory/Medical Affairs", "Clinical", "Commercial"];
  const INTEREST_COLS = ["Not interested", "Somewhat interested", "Very interested"];
  const TIMINGS = ["<6 months", "6-12 months", "12-24 months", "No immediate plans, I'm looking to explore if industry is the right fit for me."];
  const GENDER_OPTIONS = ["Female", "Male", "Transgender", "Non-binary", "Two-spirited", "Prefer not to say"];
  const IDENTITY_OPTIONS = ["Newcomer", "Racialized Person", "Veteran", "Francophone", "Person with Disability", "Inuit", "First Nations", "Metis", "Prefer not to say"];
  const VOLUNTARY = "Your response to this question is entirely voluntary and will not affect your eligibility. This information will be used to provide aggregate reporting to the Government of Canada for a federally funded grant that supports this program.";
  const PRIVACY_BEFORE_EMAIL = "The University of Toronto respects your privacy. Personal information that you provide to the University is collected pursuant to section 2(14) of the University of Toronto Act, 1971. Situated in the University of Toronto, the Biomanufacturing Hub Network (BioHubNet) is a federally funded talent development initiative that provides training programs to facilitate industry-readiness of highly qualified personnel. As part of this program, your name, contact information, academic program and institutional affiliation, academic transcript and employment status will be collected for the purpose of processing course admissions, administering training credits and reporting to the federal government for program evaluation and statistical purposes. BioHubNet may share your information with its administrative staff, affiliates, and training partners from time-to-time who have a need to know it for the purposes of registration and as part of the program's operations. Where possible, data will be released in aggregate form and de-identified. All information which has been collected will be stored securely, encrypted, and retained for as long as it is needed to meet the purposes of the program. At all times your information will be protected in accordance with the Freedom of Information and Protection of Privacy Act (FIPPA). If you have any questions, please contact BioHubNet at ";

  /* Server errors are the live app's six strings, unchanged. */
  const ERRORS = {
    missing: "Please fill in all required fields.",
    exists: "An account with that email already exists. Try signing in instead.",
    password: "That password does not meet the requirements. Use at least 8 characters with a mix of letters, numbers, and symbols.",
    signup: "We could not create your account. Please try again.",
    config: "Registration is temporarily unavailable. Please try again later.",
    dbwrite: "Your account was created but your profile could not be saved. Please contact support.",
  };

  /* ── No pre-filled entries ─────────────────────────────────────────
     Every text field starts empty in every review state (design review,
     2026-09-14) — no sample names, emails, phone numbers or typed answers.
     The answered states only pre-select choices, so an answered question's
     layout can still be reviewed. */
  const ANSWERED_SURVEY = {
    specialization: ["Molecular Biology", "Biotechnology"], lifeSciencesExperience: "No",
    "knowledge-0": "Some understanding", "knowledge-1": "Clueless!",
    "interest-0": "Very interested", "interest-1": "Very interested", "interest-2": "Somewhat interested",
    "interest-3": "Not interested", "interest-4": "Somewhat interested", "interest-5": "Not interested",
    transitionTiming: "6-12 months",
  };
  const PRESETS = {
    "step1": { step: 0, v: {} },
    "step1-validation": { step: 0, v: {}, validate: true },
    "step1-focus": { step: 0, v: {}, focus: "firstName" },
    "step2": { step: 1, v: {} },
    "step2-non-member": { step: 1, v: { institute: OTHER, occupation: "Research Assistant" }, focus: "instituteOther" },
    "step2-validation": { step: 1, v: {}, validate: true },
    "step3": { step: 2, v: {} },
    "step3-answered": { step: 2, v: { ...ANSWERED_SURVEY } },
    "step3-validation": { step: 2, v: { specialization: ["Chemistry"] }, validate: true },
    "step4": { step: 3, v: {} },
    "step4-answered": { step: 3, v: { genderIdentity: "Prefer not to say", identities: ["Newcomer", "Francophone"], privacyConsent: true } },
    "step4-validation": { step: 3, v: {}, validate: true },
    "server-error": { step: 0, v: {}, serverError: true },
    "submitting": { step: 3, v: { genderIdentity: "Prefer not to say", identities: ["Prefer not to say"], privacyConsent: true }, submitting: true },
    "submitted": { submitted: true },
  };
  const preset = PRESETS[state] || PRESETS.step1;
  const code = ERRORS[qs.get("code")] ? qs.get("code") : "exists";
  const model = { step: preset.step || 0, v: { mailingList: true, ...(preset.v || {}) } };

  /* ── Builders ─────────────────────────────────────────────────────── */
  /* The "*" is visual only. Required state is announced by the required
     attribute on text fields and the consent checkbox, and by a visually
     hidden "(required)" in each required choice question's legend — a
     checkbox group cannot carry required. */
  const REQ = '<span class="req" aria-hidden="true"> *</span>';
  const REQ_GROUP = `${REQ}<span class="sr-only"> (required)</span>`;

  function input(o) {
    return `<div class="${o.span2 ? "span-2" : ""}">
      <label class="bhn-acct-label" for="${o.name}">${esc(o.label)}${o.required ? REQ : ""}</label>
      <input class="bhn-acct-field" id="${o.name}" name="${o.name}"${o.type ? ` type="${o.type}"` : ""}${o.required ? " required" : ""}${o.autocomplete ? ` autocomplete="${o.autocomplete}"` : ""} value="${esc(o.value)}">
    </div>`;
  }

  /* label is trusted markup from the constants above. */
  function choice(type, name, value, label, checked, extra) {
    return `<label class="bhn-acct-choice"><input type="${type}" name="${name}" value="${esc(value)}"${checked ? " checked" : ""}${extra || ""}><span>${label}</span></label>`;
  }

  function otherRow(type, group, checked, label, textName, textLabel, value, multi) {
    return `<div class="reg-other">
      ${choice(type, group, OTHER, label, checked, multi ? " data-multi" : "")}
      <input class="bhn-acct-field" id="${textName}" name="${textName}" aria-label="${textLabel}" value="${esc(value)}">
    </div>`;
  }

  function grid(id, label, rows, cols) {
    const v = model.v;
    const head = cols.map((c) => `<th scope="col">${esc(c)}</th>`).join("");
    const body = rows.map((r, i) => `<tr><th scope="row">${esc(r)}</th>${cols.map((c) =>
      `<td><label class="bhn-acct-choice"><input type="radio" name="${id}-${i}" value="${esc(c)}" aria-label="${esc(r)}: ${esc(c)}"${v[`${id}-${i}`] === c ? " checked" : ""}><span class="cap" aria-hidden="true">${esc(c)}</span></label></td>`
    ).join("")}</tr>`).join("");
    return `<fieldset class="reg-q" id="q-${id}">
      <legend class="bhn-acct-label">${esc(label)}${REQ_GROUP}</legend>
      <table class="reg-grid"><thead><tr><td></td>${head}</tr></thead><tbody>${body}</tbody></table>
    </fieldset>`;
  }

  function steps(current) {
    return `<ol class="bhn-acct-steps" aria-label="Registration progress">${STEP_NAMES.map((n, i) => {
      const cls = i < current ? "is-done" : i === current ? "is-current" : "";
      const cur = i === current ? ' aria-current="step"' : "";
      const done = i < current ? '<span class="sr-only">, completed</span>' : "";
      return `<li class="${cls}"${cur}><span class="bar"></span><span class="meta"><span class="num">0${i + 1}</span><span class="name">${n}${done}</span></span></li>`;
    }).join("")}</ol>`;
  }

  function sectionOpen(i, title) {
    return `<section class="reg-section"${model.step !== i ? " hidden" : ""} aria-labelledby="reg-sec-${i}">
      <h2 id="reg-sec-${i}" class="bhn-acct-h2" tabindex="-1">${title}</h2>`;
  }

  /* About You */
  function section0() {
    const v = model.v;
    return `${sectionOpen(0, "About You")}
      <div class="bhn-acct-grid2 reg-fields">
        ${input({ name: "firstName", label: "First Name", required: true, autocomplete: "given-name", value: v.firstName })}
        ${input({ name: "lastName", label: "Last Name", required: true, autocomplete: "family-name", value: v.lastName })}
        ${input({ name: "email", label: "Email address (enter institutional email address if applying for Training Credits)", type: "email", required: true, autocomplete: "email", value: v.email, span2: true })}
        ${input({ name: "secondaryEmail", label: "Secondary Email Address (to be used for notifications/communications)", type: "email", required: true, value: v.secondaryEmail, span2: true })}
        <div class="span-2">
          <label class="bhn-acct-label" for="password">Please create a strong password for your account. The password must be at least 8 characters long and contain at least 3 of the following 4 types of characters:${REQ}</label>
          <ul class="reg-pw-rules" id="password-rules">
            <li>Lower case letters (a-z)</li>
            <li>Upper case letters (A-Z)</li>
            <li>Numbers (i.e. 0-9)</li>
            <li>Special characters (e.g. !@#$%^&amp;*)</li>
          </ul>
          <input class="bhn-acct-field" id="password" name="password" type="password" required minlength="8" autocomplete="new-password" aria-describedby="password-rules" value="${esc(v.password)}">
        </div>
        ${input({ name: "phone", label: "Phone Number", type: "tel", required: true, autocomplete: "tel", value: v.phone, span2: true })}
        ${input({ name: "address", label: "Full Current Address", required: true, autocomplete: "street-address", value: v.address, span2: true })}
      </div></section>`;
  }

  /* Education */
  function section1() {
    const v = model.v;
    const inst = v.institute || "";
    const occ = v.occupation || "";
    return `${sectionOpen(1, "Education")}
      <div class="reg-fields reg-stack">
        <fieldset class="reg-q" id="q-institute" aria-describedby="institute-note">
          <legend class="bhn-acct-label">What BioHubNet Member Institution are you currently enrolled in?${REQ_GROUP}</legend>
          <div class="reg-provinces">${INSTITUTIONS_BY_PROVINCE.map(([province, list]) => `
            <fieldset class="reg-province">
              <legend class="bhn-acct-section-label">${province}</legend>
              <div class="reg-cols">${list.map(([name, star]) => choice("radio", "institute", name, esc(name) + (star ? "&nbsp;*" : ""), inst === name)).join("")}</div>
            </fieldset>`).join("")}
          </div>
          <p class="bhn-acct-fine reg-footnote" id="institute-note">* Eligible institutions until Jan 2027</p>
          <div class="reg-rule" aria-hidden="true"></div>
          ${otherRow("radio", "institute", inst === OTHER, "Non-member institution:", "instituteOther", "Non-member institution", v.instituteOther)}
        </fieldset>
        <fieldset class="reg-q" id="q-occupation">
          <legend class="bhn-acct-label">What best describes your current position/status?${REQ_GROUP}</legend>
          <div class="reg-choices">${POSITIONS.map((x) => choice("radio", "occupation", x, esc(x), occ === x)).join("")}</div>
        </fieldset>
      </div></section>`;
  }

  /* Registration Survey */
  function section2() {
    const v = model.v;
    const spec = Array.isArray(v.specialization) ? v.specialization : [];
    return `${sectionOpen(2, "Registration Survey")}
      <div class="reg-fields reg-stack">
        <fieldset class="reg-q" id="q-specialization">
          <legend class="bhn-acct-label">Area of specialization (select all that apply)${REQ_GROUP}</legend>
          <div class="reg-cols">${SPECIALIZATIONS.map((x) => choice("checkbox", "specialization", x, esc(x), spec.includes(x), " data-multi")).join("")}</div>
          ${otherRow("checkbox", "specialization", spec.includes(OTHER), "Other (please specify):", "specializationOther", "Other (please specify)", v.specializationOther, true)}
        </fieldset>
        <fieldset class="reg-q" id="q-lifeSciencesExperience">
          <legend class="bhn-acct-label">Have you previously worked in the Life Sciences industry?${REQ_GROUP}</legend>
          <div class="reg-choices">${["Yes", "No"].map((x) => choice("radio", "lifeSciencesExperience", x, x, v.lifeSciencesExperience === x)).join("")}</div>
        </fieldset>
        ${grid("knowledge", "How would you rate your current knowledge of the following:", KNOWLEDGE_ROWS, KNOWLEDGE_COLS)}
        ${grid("interest", "Which areas in the Biomanufacturing/Life Sciences sector are you interested to learn about?", INTEREST_ROWS, INTEREST_COLS)}
        <fieldset class="reg-q" id="q-transitionTiming">
          <legend class="bhn-acct-label">When would you ideally like to transition to an industry role?${REQ_GROUP}</legend>
          <div class="reg-choices">${TIMINGS.map((x) => choice("radio", "transitionTiming", x, esc(x), v.transitionTiming === x)).join("")}</div>
        </fieldset>
      </div></section>`;
  }

  /* Diversity Self-Identification, Comments, Terms and Conditions */
  function section3() {
    const v = model.v;
    const g = v.genderIdentity || "";
    const ids = Array.isArray(v.identities) ? v.identities : [];
    return `${sectionOpen(3, "Diversity Self-Identification (Only for Administrative Purposes)")}
      <div class="reg-fields reg-stack">
        <fieldset class="reg-q" id="q-genderIdentity">
          <legend class="bhn-acct-label">${esc(VOLUNTARY)}${REQ_GROUP}</legend>
          <div class="reg-choices">
            ${GENDER_OPTIONS.map((x) => choice("radio", "genderIdentity", x, esc(x), g === x)).join("")}
            ${otherRow("radio", "genderIdentity", g === OTHER, "Other:", "genderIdentityOther", "Other, please specify", v.genderIdentityOther)}
          </div>
        </fieldset>
        <fieldset class="reg-q" id="q-identities">
          <legend class="bhn-acct-label">Please select all that apply - ${esc(VOLUNTARY)} (You may select more than one option):${REQ_GROUP}</legend>
          <div class="reg-choices">${IDENTITY_OPTIONS.map((x) => choice("checkbox", "identities", x, esc(x), ids.includes(x), " data-multi")).join("")}</div>
        </fieldset>
        <div class="reg-block">
          <h3 id="reg-comments" class="bhn-acct-h3">Comments</h3>
          <textarea class="bhn-acct-field reg-textarea" id="comments" name="comments" rows="4" aria-labelledby="reg-comments" placeholder="Please leave any additional comments or feedback">${esc(v.comments)}</textarea>
        </div>
        <div class="reg-block">
          <h3 id="reg-terms" class="bhn-acct-h3">Terms and Conditions</h3>
          <p class="bhn-acct-body" id="reg-terms-intro">By ticking the checkboxes below, you confirm that you have read, understood and agreed with the statement.</p>
          <div class="reg-consent">
            <label class="bhn-acct-choice"><input type="checkbox" name="privacyConsent" required aria-describedby="reg-terms-intro"${v.privacyConsent ? " checked" : ""}><span>${esc(PRIVACY_BEFORE_EMAIL)}<a class="bhn-acct-link" href="#" onclick="return false">info@biohubnet.ca</a>.${REQ}</span></label>
          </div>
          ${choice("checkbox", "mailingList", "yes", "Subscribe to Mailing List (Optional)", v.mailingList === true)}
        </div>
      </div></section>`;
  }

  function actions(o) {
    const st = model.step;
    const back = `<button type="button" class="bhn-acct-back reg-back${st === 0 ? " is-invisible" : ""}" data-act="back"${o.submitting ? " disabled" : ""}${st === 0 ? ' aria-hidden="true" tabindex="-1"' : ""}>${S.arrowBack()}<span>Back</span></button>`;
    let primary;
    if (st < LAST) primary = `<button type="submit" class="bhn-acct-cta" data-act="next"><span>Next</span>${S.arrow()}</button>`;
    else if (o.submitting) primary = `<button type="submit" class="bhn-acct-cta" disabled aria-busy="true"><span>Submitting</span><span class="bhn-acct-spinner" aria-hidden="true"></span></button>`;
    else primary = `<button type="submit" class="bhn-acct-cta" data-act="submit"><span>Submit</span>${S.arrow()}</button>`;
    return `<div class="reg-foot">
      <p class="bhn-acct-fine">Step ${st + 1} of ${STEP_NAMES.length}</p>
      <div class="reg-actions">${back}${primary}</div>
    </div>`;
  }

  function intro() {
    return `<section class="reg-intro" aria-labelledby="reg-title">
      <p class="bhn-acct-eyebrow is-cyan">New to BioHubNet</p>
      <h1 id="reg-title" class="bhn-acct-h1" data-keep-last>Create your account</h1>
      <p class="bhn-acct-body" data-keep-last>Join the BioHubNet marketplace.</p>
      <p class="bhn-acct-fine reg-signin">Already have an account? <a class="bhn-acct-link" href="#" onclick="return false">Sign in</a></p>
    </section>`;
  }

  function extra() {
    return `<aside class="reg-extra" aria-labelledby="reg-extra-title">
      <h2 id="reg-extra-title" class="sr-only">ENGAGE and EXPERIENCE programs</h2>
      <div>
        <p class="bhn-acct-section-label is-cyan">ENGAGE</p>
        <h3 class="bhn-acct-h3">Course marketplace</h3>
        <p class="bhn-acct-body" data-keep-last>Microcredentials for job-ready skills.</p>
        <h3 class="bhn-acct-h3" style="margin-top:0.75rem">Learning pathways</h3>
        <p class="bhn-acct-body" data-keep-last>Structured training for your career goals.</p>
      </div>
      <div class="rule">
        <p class="bhn-acct-section-label">EXPERIENCE</p>
        <h3 class="bhn-acct-h3">Internship talent pool</h3>
        <p class="bhn-acct-body" data-keep-last>Paid internships and lab exchanges across Canada.</p>
      </div>
    </aside>`;
  }

  function panel(o) {
    const alert = o.serverError
      ? `<div class="bhn-acct-alert-strip" role="alert">${esc(ERRORS[code])}</div>`
      : "";
    return `<article class="bhn-acct-panel reg-form" aria-labelledby="reg-sec-${model.step}">
      <form id="reg" class="reg-form-inner" action="#" method="post" novalidate data-live-action="/api/register">
        ${alert}
        ${steps(model.step)}
        ${section0()}${section1()}${section2()}${section3()}
        ${actions(o)}
      </form>
    </article>`;
  }

  function prelogin() {
    const accountIcon = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8c.8-3.4 3.1-5 7-5s6.2 1.6 7 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M19 8v5m-2.5-2.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    const loginIcon = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M14 5h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4M4 12h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return `
      <section class="pl-hero">
        <p class="pl-eyebrow"><span class="pl-diamond" aria-hidden="true"></span>Transformative talent development</p>
        <h1 class="pl-h1"><span class="bhn-acct-gradient-text">BioHubNet</span> <span style="white-space:nowrap">Training Platform</span></h1>
        <p class="pl-lead">For ENGAGE learners and EXPERIENCE participants. Build skills through courses and learning pathways, and prepare for internship&nbsp;opportunities.</p>
      </section>
      <section class="pl-access" aria-label="Account access">
        <div role="status" class="bhn-acct-success pl-notice">
          <p style="font-weight:700">Application submitted</p>
          <p>Thanks for registering. Your application has been submitted and will be reviewed. Sign in to track its progress.</p>
        </div>
        <div class="pl-options">
          <article class="pl-account">
            <div class="bhn-acct-title-row"><span class="bhn-acct-icon">${accountIcon}</span>
              <div style="min-width:0"><p class="bhn-acct-eyebrow is-cyan">New to BioHubNet</p><h2 class="bhn-acct-h2">Create an account</h2></div></div>
            <section class="pl-detail" aria-label="ENGAGE and EXPERIENCE programs">
              <div>
                <p class="bhn-acct-section-label is-cyan">ENGAGE</p>
                <h3 class="pl-h3">Course marketplace</h3><p class="pl-p">Microcredentials for job-ready&nbsp;skills.</p>
                <h3 class="pl-h3" style="margin-top:1rem">Learning pathways</h3><p class="pl-p">Structured training for your career&nbsp;goals.</p>
              </div>
              <div class="pl-rule">
                <p class="bhn-acct-section-label">EXPERIENCE</p>
                <h3 class="pl-h3">Internship talent pool</h3><p class="pl-p">Paid internships and lab exchanges across&nbsp;Canada.</p>
              </div>
            </section>
            <a href="#" class="bhn-acct-cta" onclick="return false"><span>Create an account</span>${S.arrow()}</a>
          </article>
          <article class="pl-account">
            <div class="bhn-acct-title-row"><span class="bhn-acct-icon is-emerald">${loginIcon}</span>
              <div style="min-width:0"><p class="bhn-acct-eyebrow is-emerald">Welcome back</p><h2 class="bhn-acct-h2">Sign in</h2></div></div>
            <section class="pl-detail" aria-labelledby="sign-in-fields-title">
              <h3 id="sign-in-fields-title" class="bhn-acct-section-label">Account credentials</h3>
              <div style="margin-top:1rem;min-width:0">
                <div><label class="bhn-acct-label" for="sign-in-email">Email address</label>
                  <input class="bhn-acct-field" id="sign-in-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
                <div style="margin-top:1rem"><label class="bhn-acct-label" for="sign-in-password">Password</label>
                  <input class="bhn-acct-field" id="sign-in-password" type="password" autocomplete="current-password" placeholder="Enter your password"></div>
              </div>
              <a class="bhn-acct-link" style="margin-top:1rem;align-self:flex-start" href="#" onclick="return false">Forgot your password?</a>
              <p class="bhn-acct-fine pl-hosted" style="margin-top:1rem">Prefer the hosted page? <a href="#" onclick="return false">Continue with Auth0 instead</a>.</p>
            </section>
            <button type="button" class="bhn-acct-cta is-returning"><span>Sign in</span>${S.arrow()}</button>
          </article>
        </div>
      </section>`;
  }

  /* ── Render + simulated behaviour ─────────────────────────────────── */
  let submitted = !!preset.submitted;
  function render(o) {
    o = o || {};
    if (submitted) {
      root.innerHTML = S.frame(prelogin(), { logoLabel: "BioHubNet home" });
    } else {
      root.innerHTML = S.frame(
        `<div class="reg-layout">${intro()}${panel(o)}${extra()}</div>`,
        { login: true, logoLabel: "BioHubNet" },
      );
    }
    S.keepLastWordsTogether(root);
  }

  function collect() {
    const f = root.querySelector("#reg");
    if (!f) return;
    f.querySelectorAll("input, select, textarea").forEach((el) => {
      if (!el.name) return;
      if (el.type === "radio") {
        // A radio group is one value: the checked option, or nothing.
        if (el.checked) model.v[el.name] = el.value;
        else if (model.v[el.name] === el.value) delete model.v[el.name];
      } else if (el.type === "checkbox" && el.hasAttribute("data-multi")) {
        // Several boxes share one name and collect into a list.
        const set = new Set(Array.isArray(model.v[el.name]) ? model.v[el.name] : []);
        if (el.checked) set.add(el.value); else set.delete(el.value);
        model.v[el.name] = [...set];
      } else {
        model.v[el.name] = el.type === "checkbox" ? el.checked : el.value;
      }
    });
  }

  /* Simulated validation, in the order the form asks. Text fields use
     Chrome's own wording. A choice question has no native bubble of its
     own, so its simulated bubble sits under the question text and focus
     moves to its first unanswered option. */
  const checkedIn = (name) => root.querySelector(`input[name="${name}"]:checked`);
  const legendOf = (id) => root.querySelector(`#q-${id} > legend`);
  function fail(anchor, focusEl, msg, group, invalidEl) {
    S.bubble(anchor, msg, { group });
    if (invalidEl) invalidEl.setAttribute("aria-invalid", "true");
    S.focusField(focusEl);
    // A tall grid can leave its question text, and so the message, above
    // the screen while the missing row is in view. Bring the message back.
    const bub = root.querySelector(".sim-bubble");
    const bar = document.querySelector(".sim-banner");
    const floor = bar && getComputedStyle(bar).position === "sticky" ? bar.getBoundingClientRect().bottom : 0;
    if (bub && bub.getBoundingClientRect().top < floor) window.scrollBy(0, bub.getBoundingClientRect().top - floor - 12);
    return false;
  }
  function passwordKinds(p) {
    return [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter((r) => r.test(p)).length;
  }
  function requireOne(id, name) {
    if (checkedIn(name)) return true;
    return fail(legendOf(id), root.querySelector(`input[name="${name}"]`), "Please select one of these options.", true);
  }
  function requireOtherText(group, textName) {
    const other = root.querySelector(`input[name="${group}"][value="${OTHER}"]`);
    const t = root.querySelector(`[name="${textName}"]`);
    if (other && other.checked && t && !t.value.trim()) {
      // Anchored after the whole row: inside the flex row the bubble would
      // squeeze the text box to nothing on a phone.
      return fail(t.closest(".reg-other"), t, "Please fill out this field.", true, t);
    }
    return true;
  }
  function validateStep(i) {
    S.clearBubbles(root);
    if (i === 0) {
      for (const name of ["firstName", "lastName", "email", "secondaryEmail", "password", "phone", "address"]) {
        const el = root.querySelector(`[name="${name}"]`);
        const val = el.value || "";
        let msg = null;
        if (!val.trim()) msg = "Please fill out this field.";
        else if (el.type === "email") msg = S.emailMessage(val);
        else if (name === "password" && val.length < 8) {
          msg = `Please lengthen this text to 8 characters or more (you are currently using ${val.length} character${val.length === 1 ? "" : "s"}).`;
        } else if (name === "password" && passwordKinds(val) < 3) {
          msg = "Please match the requested format.";
        }
        if (msg) return fail(el, el, msg);
      }
      return true;
    }
    if (i === 1) {
      return requireOne("institute", "institute") && requireOtherText("institute", "instituteOther")
        && requireOne("occupation", "occupation");
    }
    if (i === 2) {
      if (!root.querySelector('input[name="specialization"]:checked')) {
        return fail(legendOf("specialization"), root.querySelector('input[name="specialization"]'), "Please select at least one of these options.", true);
      }
      if (!requireOtherText("specialization", "specializationOther")) return false;
      if (!requireOne("lifeSciencesExperience", "lifeSciencesExperience")) return false;
      for (const [id, rows] of [["knowledge", KNOWLEDGE_ROWS], ["interest", INTEREST_ROWS]]) {
        const miss = rows.findIndex((_, r) => !checkedIn(`${id}-${r}`));
        if (miss >= 0) return fail(legendOf(id), root.querySelector(`input[name="${id}-${miss}"]`), "Please select one of these options.", true);
      }
      return requireOne("transitionTiming", "transitionTiming");
    }
    if (i === 3) {
      if (!requireOne("genderIdentity", "genderIdentity") || !requireOtherText("genderIdentity", "genderIdentityOther")) return false;
      if (!root.querySelector('input[name="identities"]:checked')) {
        return fail(legendOf("identities"), root.querySelector('input[name="identities"]'), "Please select at least one of these options.", true);
      }
      const consent = root.querySelector('input[name="privacyConsent"]');
      if (!consent.checked) return fail(root.querySelector("#reg-terms-intro"), consent, "Please check this box if you want to proceed.", true);
      return true;
    }
    return true;
  }

  function focusHeading() {
    S.focusField(root.querySelector(`#reg-sec-${model.step}`));
  }

  root.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    if (b.dataset.act === "next") {
      e.preventDefault(); collect();
      if (validateStep(model.step)) { model.step += 1; render(); focusHeading(); }
    } else if (b.dataset.act === "back") {
      e.preventDefault(); collect();
      model.step = Math.max(0, model.step - 1); render(); focusHeading();
    }
  });

  root.addEventListener("submit", (e) => {
    e.preventDefault(); collect();
    if (model.step < LAST) { if (validateStep(model.step)) { model.step += 1; render(); focusHeading(); } return; }
    if (!validateStep(LAST)) return;
    render({ submitting: true });
    setTimeout(() => {
      submitted = true;
      history.replaceState(null, "", "?state=submitted");
      render(); window.scrollTo(0, 0);
      document.querySelector(".sim-banner")?.remove();
      S.banner({ page: "Registration → /login?registered=1 (existing approved page)", states: STATES, current: "submitted" });
    }, 1300);
  });

  /* Options that carry their own text box. Typing an answer selects the
     option; choosing a different radio, or unticking the checkbox, clears
     the text so a stale answer is never kept. */
  const OTHER_TEXT = {
    instituteOther: "institute",
    specializationOther: "specialization",
    genderIdentityOther: "genderIdentity",
  };
  root.addEventListener("input", (e) => {
    if (root.querySelector(".sim-bubble")) S.clearBubbles(root);
    const group = OTHER_TEXT[e.target.name];
    if (!group || !e.target.value) return;
    const box = root.querySelector(`input[name="${group}"][value="${OTHER}"]`);
    if (box) box.checked = true;
  });
  root.addEventListener("change", (e) => {
    const t = e.target;
    if (root.querySelector(".sim-bubble")) S.clearBubbles(root);
    for (const [textName, group] of Object.entries(OTHER_TEXT)) {
      if (t.name !== group) continue;
      const clears = t.type === "radio" ? t.value !== OTHER : (t.value === OTHER && !t.checked);
      const box = root.querySelector(`[name="${textName}"]`);
      if (clears && box) box.value = "";
    }
  });

  render({ serverError: preset.serverError, submitting: preset.submitting });
  if (preset.validate) validateStep(model.step);
  if (preset.focus) {
    const el = root.querySelector(`[name="${preset.focus}"]`);
    if (el) { el.classList.add("is-sim-focus"); S.focusField(el); el.addEventListener("blur", () => el.classList.remove("is-sim-focus"), { once: true }); }
  }

  S.banner({
    page: submitted ? "Registration → /login?registered=1 (existing approved page)" : "Registration · /register",
    states: STATES,
    current: state,
    extra: state === "server-error"
      ? Object.keys(ERRORS).map((k) => ({ href: `?state=server-error&code=${k}`, label: `?error=${k}`, current: k === code }))
      : [],
  });
})();
</script>
</body>
</html>
