<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 310" role="img" aria-label="BioHubNet — Transformative Talent Development">
  <title>BioHubNet</title>
  <!--
    BioHubNet brand lockup — the name drawn literally:
      Bio → hexagon (the structural glyph of molecular life science)
      Hub → diamond core at the centre (heritage of the original
            four-diamond cluster, promoted to the focal element)
      Net → six nodes on the vertices, joined by bonds into a network
    Flat two-weight geometry, no gradients, so the mark stays crisp
    from a 16px favicon to a 1200px share card. One green node at the
    apex = talent rising out of the network.
    Palette: ink teal #1F5A68 · hub blue #1B7FB8 · bio green #4FA475.
  -->

  <!-- ─── Mark: hexagon hub-network ─── -->
  <g transform="translate(-8.6 4.6) scale(6.4)">
    <!-- Bonds: hexagonal ring through the six vertex nodes -->
    <path d="M 24 8.5 L 37.42 16.25 L 37.42 31.75 L 24 39.5 L 10.58 31.75 L 10.58 16.25 Z"
          fill="none" stroke="#1F5A68" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Spokes: hub to the three primary nodes -->
    <path d="M 24 24 L 24 8.5 M 24 24 L 37.42 31.75 M 24 24 L 10.58 31.75"
          fill="none" stroke="#1F5A68" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Hub: diamond core -->
    <rect x="18.7" y="18.7" width="10.6" height="10.6" rx="2.3"
          transform="rotate(45 24 24)" fill="#1B7FB8"/>
    <!-- Primary nodes (spoke-connected) — apex node carries the green -->
    <circle cx="24" cy="8.5" r="3.2" fill="#4FA475"/>
    <circle cx="37.42" cy="31.75" r="3.2" fill="#1F5A68"/>
    <circle cx="10.58" cy="31.75" r="3.2" fill="#1F5A68"/>
    <!-- Secondary nodes (ring-only) -->
    <circle cx="37.42" cy="16.25" r="2.2" fill="#1F5A68"/>
    <circle cx="24" cy="39.5" r="2.2" fill="#1F5A68"/>
    <circle cx="10.58" cy="16.25" r="2.2" fill="#1F5A68"/>
  </g>

  <!-- ─── Wordmark ─── -->
  <g font-family="'Helvetica Neue','Inter','Arial',sans-serif">
    <text x="296" y="183" font-size="150" font-weight="700" letter-spacing="-3">
      <tspan fill="#1F5A68">Bio</tspan><tspan fill="#1B7FB8">Hub</tspan><tspan fill="#3F9268">Net</tspan>
    </text>
    <text x="301" y="259" font-size="40" font-weight="500" letter-spacing="2" fill="#2E6B79">
      Transformative Talent Development
    </text>
  </g>
</svg>
