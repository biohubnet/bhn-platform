<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-label="BioHubNet — Transformative Talent Development">
  <title>BioHubNet — Transformative Talent Development</title>

  <!-- Stripe pattern. Each repeat is 16 units tall — 10 colored + 6
       transparent so the bg shows through and the diamond reads with
       venetian-blind cuts. currentColor carries the per-diamond hue. -->
  <defs>
    <pattern id="bhn-stripe" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="16" height="10" fill="currentColor"/>
    </pattern>
  </defs>

  <!-- Mark: four overlapping striped diamonds in a 200x200 box. -->
  <g transform="translate(20, 20)">
    <!-- Top-left teal -->
    <g color="#2D7872">
      <polygon points="50,4 100,54 50,104 0,54" fill="url(#bhn-stripe)"/>
    </g>
    <!-- Top-right mint -->
    <g color="#7DC495">
      <polygon points="150,4 200,54 150,104 100,54" fill="url(#bhn-stripe)"/>
    </g>
    <!-- Bottom-left blue (overlaps top-left) -->
    <g color="#187FB0">
      <polygon points="50,84 100,134 50,184 0,134" fill="url(#bhn-stripe)"/>
    </g>
    <!-- Bottom-right mint -->
    <g color="#7DC495">
      <polygon points="150,84 200,134 150,184 100,134" fill="url(#bhn-stripe)"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="260" y="130" font-size="100" font-weight="900" letter-spacing="-2">
      <tspan fill="#2D7872">Bio</tspan><tspan fill="#187FB0">Hub</tspan><tspan fill="#7DC495">Net</tspan>
    </text>
    <text x="262" y="170" font-size="22" font-weight="700" letter-spacing="3.2" fill="#2D7872">
      TRANSFORMATIVE TALENT DEVELOPMENT
    </text>
  </g>
</svg>
