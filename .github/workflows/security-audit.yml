# Lightweight per-PR security checks that complement CodeQL:
#
#   • npm audit  — flags packages with known CVEs (CodeQL doesn't do
#     dependency CVEs; Dependabot does, but on its own schedule, so
#     this surfaces them in the PR review itself).
#   • TruffleHog — scans the diff for committed secrets (API keys,
#     R2 credentials, NextAuth secrets). GitHub Secret Scanning
#     covers known patterns post-merge; TruffleHog catches them in
#     the PR before they're public.
#
# Both run as advisories — they don't block the merge unless the
# severity threshold is exceeded — to avoid a "broken main" spiral
# whenever an upstream advisory drops a Friday afternoon.

name: "Security audit"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  npm-audit:
    name: "npm audit (high+)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Advisory, as the header above always claimed it was. It never
    # behaved that way: `npm audit --audit-level=high` EXITS NONZERO the
    # moment a high advisory exists, so from the day one landed this job
    # failed on every single push to main and emailed on every one. A
    # dependency CVE is not a reason to mark a commit broken — it is not
    # about the commit. The report still runs and is still visible in the
    # run; it just no longer fails the build.
    #
    # The TruffleHog job below is deliberately NOT advisory. A committed
    # secret IS about the commit, and should stop it.
    #
    # Split by event rather than blanket-advisory. The reasoning above
    # holds for `push`: an advisory published overnight is not about the
    # commit that happens to land next, and breaking main over it is
    # noise. It does NOT hold for a pull request, where the question is
    # "should this merge while runtime deps carry a known high CVE" —
    # and there the answer is no. Blanket `true` also made this check
    # structurally incapable of failing, which is worse than absent: it
    # occupies a slot in the checks list and reports nothing.
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install
        # --ignore-scripts: prisma's postinstall hook tries to talk to
        # the live database and fails in CI; we don't need a working
        # client to audit the lockfile.
        run: npm ci --ignore-scripts
      - name: Audit (high or critical, runtime deps only)
        # --omit=dev so we don't fail on a CI-only or build-only dep
        # whose CVE doesn't reach production.
        run: npm audit --audit-level=high --omit=dev

  secret-scan:
    name: "TruffleHog secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PULL REQUESTS ONLY, which is what this job was always for — the
    # header above says it "catches them in the PR before they're
    # public", with GitHub Secret Scanning covering post-merge.
    #
    # It was configured base=default_branch, head=HEAD. On a push to
    # main those are the SAME commit, so there is no diff range and the
    # action errors out. Every push run has failed on that since the
    # workflow landed — not on a finding, on an empty range. Which means
    # the job was contributing nothing but noise on push, while the PR
    # runs (base != head) were passing and doing the real work.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed so TruffleHog can scan diffs for any
          # commit pushed in this PR, not just the tip.
          fetch-depth: 0
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
