name: CI

# The three gates the stack description claimed existed and did not:
# build/typecheck, unit, and a schema check. E2E is covered separately by
# e2e-playwright.yml, which waits on the Vercel preview.
#
# Runs on PRs and on pushes to main. Pushes matter here: main is pushed to
# directly in this repo, so a PR-only gate would let most changes through
# ungated.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build + typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install deps
        # --ignore-scripts skips prisma's postinstall, which wants a live
        # database. We generate the client explicitly in the next step.
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        # tsc OOMs at the default heap on a codebase this size (exit 134,
        # "Ineffective mark-compacts near heap limit"). The runner has far
        # more RAM than Node will take by default.
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
      - name: Build
        # NOT `npm run build` — that script is `prisma generate && prisma
        # migrate deploy && next build`, and the migrate step would run
        # against whatever DATABASE_URL resolves to. `next build` alone
        # needs no database: only 10 of ~667 routes prerender and none of
        # them reads Prisma, so an unreachable host is fine and is the
        # point — it proves the build cannot silently depend on one.
        run: npx next build
        env:
          # Same heap story as the typecheck step above — next build on
          # ~667 routes exceeds the runner's default and dies with
          # "Ineffective mark-compacts near heap limit". The runner has
          # 16 GB; this asks for half.
          NODE_OPTIONS: "--max-old-space-size=8192"
          DATABASE_URL: "postgresql://nobody:nobody@127.0.0.1:1/nodb"
          DIRECT_URL: "postgresql://nobody:nobody@127.0.0.1:1/nodb"
          NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXTAUTH_URL: "http://localhost:3001"

  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: Generate Prisma client
        # The unit suite imports route modules, which transitively import
        # the Prisma client.
        run: npx prisma generate
      - name: Run unit tests
        # Playwright's runner, project `unit`. No `playwright install`
        # here on purpose: these tests never request a browser fixture,
        # so no browser is ever launched (verified by running them with
        # PLAYWRIGHT_BROWSERS_PATH pointed at an empty directory).
        run: npm run test:unit
        env:
          DATABASE_URL: "postgresql://nobody:nobody@127.0.0.1:1/nodb"
          DIRECT_URL: "postgresql://nobody:nobody@127.0.0.1:1/nodb"
          NEXTAUTH_SECRET: "ci-unit-only-not-a-real-secret"

  schema:
    name: "Schema + migrations (clean Postgres 16)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking as of the baseline (0_init). Before it, the 135 incremental
    # migrations could not replay from empty — the chain died at migration
    # 29 with `column "accountKind" does not exist` — so this job could
    # never have gone green and ran advisory. It builds the schema from
    # nothing on every PR now, which is what stops the next ordering
    # mistake reaching main.
    services:
      postgres:
        # pgvector/pgvector:pg16 is stock Postgres 16 with the vector
        # extension already present. Installing postgresql-16-pgvector on
        # the RUNNER does nothing — the database runs in a service
        # container with its own filesystem, which is how the first
        # version of this job failed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway container. Deliberately NOT a secret and deliberately not
      # the production URL — this job's whole purpose is to prove the
      # migration chain replays from nothing.
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/bhn_ci"
      DIRECT_URL: "postgresql://postgres:postgres@127.0.0.1:5432/bhn_ci"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --ignore-scripts

      - name: Enable pgvector
        # Two migrations do CREATE EXTENSION IF NOT EXISTS vector. The
        # image ships it; this just turns it on for the database.
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d bhn_ci \
            -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Validate schema
        run: npx prisma validate

      - name: Replay every migration on an empty database
        # Replays whatever prisma/migrations contains against an empty
        # pg16. Today that is one squashed baseline (0_init), not the
        # 135-migration chain this comment used to advertise — that
        # chain was unreplayable from empty (it died at migration 29 on
        # a column a later migration created) which is why it was
        # squashed. Worth knowing when reading a green result: it proves
        # the baseline reproduces schema.prisma, not that a long history
        # still applies.
        run: npx prisma migrate deploy

      - name: Schema drift check
        # After replaying, the database must match schema.prisma exactly.
        # A non-empty diff means someone edited the schema without adding
        # the migration for it — the failure mode this job exists to catch.
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "No drift: migrations reproduce schema.prisma exactly."

      - name: Migrations apply on top of main, not just from empty
        # The step above proves migrations rebuild the schema from
        # NOTHING. That is not the situation a deploy is ever in: prod
        # already holds main's state, and `migrate deploy` runs against
        # it on every Vercel build. A migration can pass a from-empty
        # replay and still fail in production — adding a NOT NULL column
        # with no default is the classic one, fine on an empty table and
        # fatal on a populated one.
        #
        # So: wipe, apply MAIN's migrations to get the shape prod is
        # actually in, then apply only what this PR adds on top, then
        # re-check drift. That is the upgrade path a deploy takes.
        #
        # PR-only. On a push to main the two trees are identical and
        # this would just replay the same migrations twice.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d bhn_ci \
            -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector'

          git fetch --depth=1 origin main

          # rm -rf before each checkout is load-bearing. `git checkout
          # <ref> -- <path>` OVERLAYS that path: it writes the ref's
          # files but does not delete files the ref lacks. Without the
          # rm, this PR's brand-new migration directories would survive
          # into the "main's state" phase and get applied there — which
          # is precisely the thing this step is trying to hold back.
          rm -rf prisma/migrations
          git checkout FETCH_HEAD -- prisma/migrations
          echo "--- applying main's migrations (the shape production is in) ---"
          npx prisma migrate deploy

          rm -rf prisma/migrations
          git checkout HEAD -- prisma/migrations
          echo "--- applying what this PR adds, on top ---"
          npx prisma migrate deploy

          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "Upgrade path clean: main -> this PR reproduces schema.prisma." 
