name: CI

# The three gates the stack description claimed existed and did not:
# build/typecheck, unit, and a schema check. E2E is covered separately by
# e2e-playwright.yml, which waits on the Vercel preview.
#
# Runs on PRs and on pushes to main. Pushes matter here: main is pushed to
# directly in this repo, so a PR-only gate would let most changes through
# ungated.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build + typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install deps
        # --ignore-scripts skips prisma's postinstall, which wants a live
        # database. We generate the client explicitly in the next step.
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        # tsc OOMs at the default heap on a codebase this size (exit 134,
        # "Ineffective mark-compacts near heap limit"). The runner has far
        # more RAM than Node will take by default.
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
      - name: Build
        # NOT `npm run build` — that script is `prisma generate && prisma
        # migrate deploy && next build`, and the migrate step would run
        # against whatever DATABASE_URL resolves to. `next build` alone
        # needs no database: only 10 of ~667 routes prerender and none of
        # them reads Prisma, so an unreachable host is fine and is the
        # point — it proves the build cannot silently depend on one.
        run: npx next build
        env:
          # Same heap story as the typecheck step above — next build on
          # ~667 routes exceeds the runner's default and dies with
          # "Ineffective mark-compacts near heap limit". The runner has
          # 16 GB; this asks for half.
          NODE_OPTIONS: "--max-old-space-size=8192"
          DATABASE_URL: "postgresql://nobody:nobody@127.0.0.1:1/nodb"
          DIRECT_URL: "postgresql://nobody:nobody@127.0.0.1:1/nodb"
          NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXTAUTH_URL: "http://localhost:3001"

  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: Generate Prisma client
        # The unit suite imports route modules, which transitively import
        # the Prisma client.
        run: npx prisma generate
      - name: Run unit tests
        run: npm run test:page-review
        env:
          DATABASE_URL: "postgresql://nobody:nobody@127.0.0.1:1/nodb"
          DIRECT_URL: "postgresql://nobody:nobody@127.0.0.1:1/nodb"
          NEXTAUTH_SECRET: "ci-unit-only-not-a-real-secret"

  schema:
    name: "Schema + migrations (clean Postgres 16)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking as of the baseline (0_init). Before it, the 135 incremental
    # migrations could not replay from empty — the chain died at migration
    # 29 with `column "accountKind" does not exist` — so this job could
    # never have gone green and ran advisory. It builds the schema from
    # nothing on every PR now, which is what stops the next ordering
    # mistake reaching main.
    services:
      postgres:
        # pgvector/pgvector:pg16 is stock Postgres 16 with the vector
        # extension already present. Installing postgresql-16-pgvector on
        # the RUNNER does nothing — the database runs in a service
        # container with its own filesystem, which is how the first
        # version of this job failed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway container. Deliberately NOT a secret and deliberately not
      # the production URL — this job's whole purpose is to prove the
      # migration chain replays from nothing.
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/bhn_ci"
      DIRECT_URL: "postgresql://postgres:postgres@127.0.0.1:5432/bhn_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --ignore-scripts

      - name: Enable pgvector
        # Two migrations do CREATE EXTENSION IF NOT EXISTS vector. The
        # image ships it; this just turns it on for the database.
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d bhn_ci \
            -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Validate schema
        run: npx prisma validate

      - name: Replay every migration on an empty database
        # The real check: 135 hand-written SQL migrations, applied in order
        # to a database with nothing in it. Catches a migration that only
        # works against the current production state.
        run: npx prisma migrate deploy

      - name: Schema drift check
        # After replaying, the database must match schema.prisma exactly.
        # A non-empty diff means someone edited the schema without adding
        # the migration for it — the failure mode this job exists to catch.
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "No drift: migrations reproduce schema.prisma exactly."
