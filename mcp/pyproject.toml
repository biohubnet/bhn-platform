[project]
name = "bhn-mcp"
version = "0.1.0"
description = "MCP server exposing BHN AI metrics, the review queue, an eval trigger, and contact search."
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bhn-mcp = "bhn_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bhn_mcp"]
